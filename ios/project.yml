name: Cheech
options:
  bundleIdPrefix: com.octopilot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Cheech:
    type: application
    platform: iOS
    sources:
      - path: Cheech
      - path: compat
      - path: ../src/game_board.cc
        group: CheechCore
      - path: ../src/game_hole.cc
        group: CheechCore
      - path: ../src/game_server.cc
        group: CheechCore
      - path: ../src/game_client.cc
        group: CheechCore
      - path: ../src/utility.cc
        group: CheechCore
      - path: ../src/bot_base.cc
        group: CheechCore
      - path: ../src/bot_random.cc
        group: CheechCore
      - path: ../src/bot_simple.cc
        group: CheechCore
      - path: ../src/bot_lookahead.cc
        group: CheechCore
      - path: ../src/bot_friendly.cc
        group: CheechCore
      - path: ../src/bot_mean.cc
        group: CheechCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octopilot.cheech
        PRODUCT_NAME: Cheech
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Cheech/Supporting/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Cheech/Supporting/Cheech-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/compat
          - $(SRCROOT)/../src
        GCC_PREPROCESSOR_DEFINITIONS:
          - CHEECH_IOS=1
          - $(inherited)
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        LLVM_LTO: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "2"
