<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#2f7d3a">
	<title>Cheech — Chinese Checkers</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="css/cheech.css">
</head>
<body>
<div class="app" id="app" data-view="join">
	<header class="topbar">
		<div class="brand" aria-label="Cheech">
			<img class="brand-mark" src="favicon.svg" alt="" width="30" height="30">
			<span class="brand-text">
				<strong>Cheech</strong>
				<small>Chinese Checkers</small>
			</span>
		</div>

		<nav class="menus" aria-label="Main menu">
			<details class="menu" id="gameMenu" hidden>
				<summary>Game</summary>
				<div class="menu-panel">
					<button type="button" data-action="undo">Undo Move</button>
					<button type="button" data-action="redo">Redo Move</button>
					<div class="menu-sep"></div>
					<button type="button" class="danger" data-action="leave">Leave Board</button>
				</div>
			</details>
			<details class="menu" id="playerMenu" hidden>
				<summary>Player</summary>
				<div class="menu-panel">
					<button type="button" data-action="name">Change Name…</button>
					<button type="button" data-action="color" id="changeColorAction">Change Color…</button>
				</div>
			</details>
			<details class="menu" id="helpMenu">
				<summary>Help</summary>
				<div class="menu-panel">
					<button type="button" data-action="howto">How to Play</button>
					<button type="button" data-action="about">About Cheech</button>
				</div>
			</details>
		</nav>

		<div class="topbar-right">
			<span class="conn-pill" id="connPill" data-state="idle">
				<span class="conn-dot" aria-hidden="true"></span>
				<span id="connText">Not connected</span>
			</span>
		</div>
	</header>

	<main class="join-screen" id="joinScreen">
		<div class="join-card">
			<img class="join-hero" src="cheech.png" alt="" width="96" height="96">
			<h1>Cheech</h1>
			<p class="join-lede">Join a game of Chinese Checkers hosted on this server.</p>

			<form class="join-form" id="joinForm">
				<label class="field">
					<span>Your name</span>
					<input id="joinName" name="name" type="text" maxlength="40"
						autocomplete="nickname" spellcheck="false" placeholder="Player" required>
				</label>

				<fieldset class="field color-field" id="joinColorField">
					<legend>Peg color</legend>
					<div class="color-swatches" id="joinColors" role="radiogroup" aria-label="Peg color"></div>
				</fieldset>

				<label class="switch-row">
					<input type="checkbox" id="joinSpectator">
					<span class="switch" aria-hidden="true"></span>
					<span class="switch-copy">
						<strong>Watch as a spectator</strong>
						<small>See the board and chat without playing.</small>
					</span>
				</label>

				<p class="form-error" id="joinError" role="alert" hidden></p>
				<button type="submit" class="btn primary wide" id="joinButton">Join Game</button>
			</form>

			<div class="join-links">
				<button type="button" class="link-btn" data-action="howto">How to Play</button>
				<span aria-hidden="true">·</span>
				<button type="button" class="link-btn" data-action="about">About</button>
			</div>
		</div>
	</main>

	<main class="game" id="gameScreen" hidden>
		<section class="board-stage" id="boardStage" aria-label="Chinese Checkers board">
			<canvas id="board" role="img"
				aria-label="Chinese Checkers board. Select one of your pegs, then choose the holes to move through."></canvas>

			<div class="turn-badge" id="turnBadge" role="status" aria-live="polite">
				<span class="turn-dot" id="turnDot" aria-hidden="true"></span>
				<span id="turnText">Waiting…</span>
			</div>

			<div class="move-badge" id="moveBadge">Move 1</div>

			<div class="winner-banner" id="winnerBanner" hidden>
				<span class="winner-kicker">Game over</span>
				<strong id="winnerText"></strong>
			</div>

			<div class="move-controls" id="moveControls" hidden>
				<button type="button" class="btn ghost" id="cancelMove">Cancel</button>
				<button type="button" class="btn primary" id="commitMove">Move</button>
			</div>

			<div class="board-hint" id="boardHint" hidden></div>
		</section>

		<aside class="sidebar" aria-label="Game information">
			<section class="card">
				<header class="card-head">
					<h2>Players</h2>
					<span class="chip" id="spectatorChip" hidden>Spectating</span>
				</header>
				<ul class="player-list" id="playerList"></ul>
			</section>

			<section class="card">
				<header class="card-head"><h2>Game</h2></header>
				<dl class="game-info" id="gameInfo"></dl>
			</section>

			<section class="card chat-card">
				<header class="card-head"><h2>Chat</h2></header>
				<div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
				<form class="chat-form" id="chatForm">
					<input id="chatInput" type="text" maxlength="500" autocomplete="off"
						placeholder="Say something…" aria-label="Chat message">
					<button class="btn primary" type="submit">Send</button>
				</form>
			</section>
		</aside>
	</main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog id="modal" class="modal">
	<div class="modal-head">
		<h2 id="modalTitle"></h2>
		<button type="button" class="icon-btn" id="modalClose" aria-label="Close">×</button>
	</div>
	<div class="modal-body" id="modalBody"></div>
	<div class="modal-actions" id="modalActions"></div>
</dialog>

<noscript>
	<p class="noscript">Cheech’s web client needs JavaScript enabled.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
